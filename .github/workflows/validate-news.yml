name: Validate News content

on:
  pull_request_target:
    branches: [test, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [cms, cms-test, test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-news-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: News Content
    runs-on: ubuntu-latest
    steps:
      # CMS branches and PRs supply data only. Manual dispatch may validate a
      # reviewed automation change before that workflow reaches the main branch.
      - name: Check out trusted validation tools
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.base.sha || 'main' }}
          path: automation
          persist-credentials: false

      - name: Check out proposed News content
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: news
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check News file boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ALLOW_MAINTENANCE: ${{ github.ref_name != 'cms' && github.ref_name != 'cms-test' }}
        run: node automation/.github/news-promotion.ts boundary news

      - name: Validate content and build
        uses: ./automation/.github/actions/validate-news
        with:
          news-directory: news
          website-ref: ${{ (github.event.pull_request.base.ref == 'test' || github.ref_name == 'test' || github.ref_name == 'cms-test') && 'test' || 'main' }}
