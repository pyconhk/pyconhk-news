name: Publish CMS News
run-name: "Publish CMS News [${{ github.event_name == 'schedule' && 'all' || inputs.target || ((github.event.workflow_run.head_branch == 'cms-test' || github.event.workflow_run.head_branch == 'test' || github.ref_name == 'test') && 'test' || 'production') }}] ${{ inputs.reconcile_id }}"

on:
  push:
    branches: [main, test]
  workflow_run:
    workflows: [Validate News content]
    types: [completed]
    branches: [cms, cms-test, main, test]
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [production, test]
        default: production
      reconcile_id:
        type: string
        default: ''
      deploy_after:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  select:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'cms' || github.event.workflow_run.head_branch == 'cms-test'))) && (github.event_name != 'schedule' || vars.CONTENT_RECONCILIATION_ENABLED != 'true')
    runs-on: ubuntu-latest
    outputs:
      routes: ${{ steps.routes.outputs.routes }}
    steps:
      - id: routes
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          CMS_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT" = schedule ]; then
            echo 'routes=[{"source":"cms","target":"main"},{"source":"cms-test","target":"test"}]' >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = test ] || [ "$CMS_BRANCH" = cms-test ]; then
            echo 'routes=[{"source":"cms-test","target":"test"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'routes=[{"source":"cms","target":"main"}]' >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: select
    # Never execute a manually dispatched publication workflow from an editor's branch.
    if: github.event_name != 'push' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'cms' || github.event.workflow_run.head_branch == 'cms-test')))
    runs-on: ubuntu-latest
    concurrency:
      group: publish-cms-news-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.routes) }}
    steps:
      - name: Check out trusted publication tools
        uses: actions/checkout@v5
        with:
          ref: main
          path: automation
          persist-credentials: false

      - name: Check out published News history
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.target }}
          path: news
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Test publication safeguards
        run: node --test automation/.github/news-promotion.test.ts

      - name: Prepare a pinned merge candidate
        id: prepare
        run: node automation/.github/news-promotion.ts prepare news '${{ matrix.source }}' '${{ matrix.target }}'

      - name: Validate content and build
        if: steps.prepare.outputs.changed == 'true'
        uses: ./automation/.github/actions/validate-news
        with:
          news-directory: news
          website-ref: ${{ matrix.target }}

      - name: Automatically publish the validated candidate
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/.github/news-promotion.ts publish news

      - name: Immediately reconcile the published website
        # Publication remains successful during a Worker outage; cron repairs the missed handoff.
        continue-on-error: true
        if: vars.CONTENT_RECONCILIATION_ENABLED == 'true' && (steps.prepare.outputs.changed == 'true' || inputs.deploy_after)
        env:
          RECONCILER_URL: ${{ vars.RECONCILER_URL }}
          RECONCILER_TOKEN: ${{ secrets.RECONCILER_TOKEN }}
          DEPLOYMENT_TARGET: ${{ matrix.target == 'main' && 'production' || 'test' }}
          RECONCILE_ID: ${{ inputs.reconcile_id }}
        run: node automation/.github/news-promotion.ts deploy

      # GITHUB_TOKEN merges do not trigger push workflows. Also backfill a missed
      # sync when prepare finds the intake snapshot already published.
      - name: Sync published changes back to the CMS intake
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/.github/news-promotion.ts sync news '${{ matrix.target }}'

  sync:
    name: Sync published News to CMS
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'test'))
    runs-on: ubuntu-latest
    concurrency:
      group: publish-cms-news-${{ github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out trusted synchronization tools
        uses: actions/checkout@v5
        with:
          ref: main
          path: automation
          persist-credentials: false

      - name: Check out published News history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          path: news
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Test publication safeguards
        run: node --test automation/.github/news-promotion.test.ts

      - name: Preserve CMS edits while syncing published changes
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: node automation/.github/news-promotion.ts sync news "$PUBLISHED_BRANCH"
